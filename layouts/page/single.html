{{ define "main" }}
<div class="post-hero">
  <div class="post-hero-inner">
    <a href="/" class="post-back">← Startsidan</a>
    <h1 class="post-title">{{ .Title }}</h1>
  </div>
</div>
<div class="post-body kontakt-body">
  {{ with .Params.avatar }}
  <div class="kontakt-avatar">
    <img src="{{ . }}" alt="Esko Österbacka">
  </div>
  {{ end }}
  {{ .Content }}
</div>
{{ end }}
