<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }} — Sport i bilder{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Params.excerpt | default .Site.Params.description }}{{ end }}">
  {{ $css := resources.Get "css/main.css" | minify }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">Sport i bilder</a>
    <nav class="site-nav">
      <a href="/sports/fotboll">Fotboll</a>
      <a href="/sports/futsal">Futsal</a>
      <a href="/sports/innebandy">Innebandy</a>
      <a href="/kontakt">Kontakt</a>
    </nav>
  </header>

  {{ block "main" . }}{{ end }}

  <footer>
    <div class="footer-inner">
      <div class="footer-instagram">
        <a href="https://www.instagram.com/osterbackaphoto/" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          @osterbackaphoto
        </a>
      </div>
      <p class="footer-bildtext">Bilderna är fria att användas på sociala medier om du taggar @osterbackaphoto på Instagram.</p>
      <nav class="footer-nav">
        <a href="/">Startsidan</a>
        <a href="/kontakt">Kontakt</a>
      </nav>
      <p class="footer-copy">© {{ now.Year }} Osterbacka Photo</p>
    </div>
  </footer>
</body>
</html>
